<style>
:root{--ink:#3a2550;--line:#5b3a7a;--lila:#c8a2e8;--lilaD:#9b72c9;--paper:#fff7fb;--bg:#1a1226}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{font-family:'Pixelify Sans',ui-rounded,-apple-system,system-ui,'Segoe UI',sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
#app{position:relative;height:100vh;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(#22183a,#3a2752);padding-top:env(safe-area-inset-top)}
#hud{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 4px;color:#f3e6fb;font-size:14px;min-height:38px;gap:8px}
#chap{opacity:.9;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .r{display:flex;gap:8px;align-items:center;flex:none}
#hc{background:rgba(0,0,0,.25);padding:3px 8px;border:2px solid var(--line)}
#hc.pulse{animation:pulse .35s}
@keyframes pulse{50%{transform:scale(1.2)}}
#mute{font:inherit;font-size:15px;width:34px;height:30px;background:var(--lila);color:#2a1d3a;border:2px solid #f3e6fb;box-shadow:0 3px 0 var(--line);padding:0;border-radius:0}
#mute.off{opacity:.45}
#stageWrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 8px 22px}
#stage{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;border:3px solid var(--line);box-shadow:0 0 0 3px rgba(243,230,251,.15),0 8px 30px rgba(0,0,0,.45);background:#140f26}
#title{position:absolute;left:0;right:0;top:9%;text-align:center;pointer-events:none;transition:opacity .6s}
#title h1{margin:0;font-size:46px;color:#fff;letter-spacing:4px;text-shadow:3px 3px 0 var(--lilaD),6px 6px 0 var(--line)}
#title p{margin:8px 0 0;color:#f3e6fb;font-size:18px;letter-spacing:2px;text-shadow:2px 2px 0 var(--line)}
#title.hide{opacity:0}
#dialog{position:relative;margin:0 10px calc(12px + env(safe-area-inset-bottom));background:var(--paper);border:4px solid var(--line);box-shadow:0 0 0 3px #f3e6fb,0 6px 0 3px #2a1d3a;padding:16px 14px 24px;min-height:172px;font-size:17px;line-height:1.45}
#name{position:absolute;top:-17px;left:10px;background:var(--lila);color:#2a1d3a;border:3px solid var(--line);padding:2px 10px;font-size:14px;font-weight:600;display:none}
#text{white-space:pre-line;min-height:48px}
#next{position:absolute;right:12px;bottom:5px;color:var(--lilaD);animation:blink 1s steps(2) infinite;font-size:14px;visibility:hidden}
@keyframes blink{50%{opacity:0}}
#choices{margin-top:8px}
#choices[hidden]{display:none}
#choices button{display:block;width:100%;margin:8px 0 0;padding:11px 10px;font:inherit;font-size:16px;background:#f1e4fb;color:var(--ink);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:0;-webkit-appearance:none;appearance:none;text-align:center;line-height:1.25}
#choices button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
#choices.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#choices.grid button{margin:0;font-size:14px;padding:10px 6px}
#choices button.right{background:#c9f2c9}
#choices button.wrong{background:#f7c6d0;animation:shake .35s;opacity:.7}
#choices button.start{font-size:20px;background:var(--lila);font-weight:700;padding:14px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#chapter{position:absolute;inset:0;z-index:20;background:rgba(20,12,32,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;opacity:0;pointer-events:none;transition:opacity .4s;padding:24px}
#chapter.show{opacity:1;pointer-events:auto}
.ctag{color:var(--lila);font-size:18px;letter-spacing:4px}
.cdate{font-size:34px;margin:12px 0;text-shadow:3px 3px 0 var(--line)}
.csub{font-size:18px;color:#f3e6fb}
.ctap{margin-top:40px;font-size:14px;color:var(--lila);animation:blink 1s steps(2) infinite}
#notif{position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;background:rgba(20,12,32,.55);opacity:0;pointer-events:none;transition:opacity .3s}
#notif.show{opacity:1;pointer-events:auto}
.phone{width:min(84%,330px);background:#1c1c24;border:4px solid #f3e6fb;border-radius:24px;padding:14px 12px 16px;box-shadow:0 10px 40px rgba(0,0,0,.5);transform:translateY(24px);transition:transform .4s}
#notif.show .phone{transform:none}
.ph-top{color:#aaa;font-size:13px;text-align:center;margin-bottom:10px}
.ph-card{display:flex;gap:10px;align-items:center;background:#2b2b36;color:#fff;padding:12px;border-radius:12px;font-size:15px;line-height:1.35}
.ph-av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#c8a2e8,#ff7eb6);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.ph-btns{display:flex;gap:8px;margin-top:12px}
.ph-btns button{flex:1;font:inherit;font-size:15px;padding:10px 4px;border:none;border-radius:10px;background:var(--lila);color:#2a1d3a;font-weight:600;-webkit-appearance:none}
.ph-btns button+button{background:#ff7eb6}
.ph-btns button:disabled{opacity:.5}
#letter{position:absolute;inset:0;z-index:18;background:rgba(20,12,32,.72);display:flex;align-items:center;justify-content:center;padding:16px 14px calc(16px + env(safe-area-inset-bottom));opacity:0;pointer-events:none;transition:opacity .8s}
#letter.show{opacity:1;pointer-events:auto}
.paper{width:100%;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff6ea;border:4px solid var(--line);box-shadow:0 0 0 3px #f3e6fb,0 8px 0 3px #2a1d3a;padding:20px 18px;font-size:17px;line-height:1.55;color:var(--ink);-webkit-user-select:text;user-select:text}
.paper h2{margin:0 0 12px;font-size:25px;color:var(--lilaD)}
.lp{opacity:0;transform:translateY(6px);transition:opacity 1s,transform 1s;margin:0 0 12px}
.lp.on{opacity:1;transform:none}
.sig{text-align:right;font-weight:600}
.lbtns{display:flex;gap:8px;margin-top:14px;opacity:0;transition:opacity 1s;pointer-events:none}
.lbtns.on{opacity:1;pointer-events:auto}
.lbtns button{flex:1;font:inherit;font-size:15px;padding:10px 6px;background:#f1e4fb;border:3px solid var(--line);box-shadow:0 4px 0 var(--line);color:var(--ink);border-radius:0;-webkit-appearance:none}
#fx{position:absolute;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.hp{position:absolute;background-size:100% 100%;image-rendering:pixelated;animation-name:hp;animation-timing-function:cubic-bezier(.2,.7,.4,1);animation-fill-mode:forwards;will-change:transform,opacity}
.hp.amb{animation-timing-function:linear}
@keyframes hp{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}12%{opacity:1}75%{opacity:.9}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:0}}
.toast{position:absolute;transform:translate(-50%,-120%);background:var(--paper);border:3px solid var(--line);padding:3px 8px;font-size:14px;color:var(--ink);white-space:nowrap;animation:toast 1.1s forwards}
@keyframes toast{0%{opacity:0;margin-top:6px}20%{opacity:1;margin-top:0}80%{opacity:1}100%{opacity:0;margin-top:-16px}}
#rot{display:none}
@media (orientation:landscape) and (max-height:500px){#rot{display:flex;position:fixed;inset:0;z-index:99;background:var(--bg);color:#fff;align-items:center;justify-content:center;font-size:20px;text-align:center;padding:20px}}
</style>
</head>
<body>
<div id="app">
  <div id="hud"><span id="chap">💜 Melisa</span><span class="r"><span id="hc">💜 0</span><button id="mute" aria-label="Ses">♪</button></span></div>

</div>

<script>

const LW=144, LH=180; let S=2;

g:"#7d8a4e",G:"#5e6a38",n:"#1f2a44",N:"#151d33",y:"#f0d070",Y:"#c9a84a",m:"#d9707a",w:"#ffffff",l:"#c8a2e8",L:"#9b72c9",o:"#2a2a2a",
a:"#5a3a28",c:"#4f7cac",v:"#a9aeb6",V:"#6b7078",u:"#3b5ba8",d:"#ecd3a0",x:"#c0392b",q:"#a0522d",f:"#fff3dc",z:"#e6e6f5",Z:"#9fb4d8",
j:"#6b3a2a",X:"#e0559a",P:"#f4a3b4",T:"#2f5d50",U:"#244a40"};
const SPR={

"..rrrttrrr..",".rrrrttrrrr.",".rrrrttrrrr.",".rrrrrkrrrr.",".srrrrkrrrs.",".srrrrkrrrs.","...pppppp...","...ppp.ppp..","...ppp.ppp..","...ppp.ppp..","..ooo..ooo.."],
mel:["...gggggg...","..gggGgggg..",".gggggggggg.",".ggssssssgg.",".gssssssssg.",".gsessssesg.",".gPssssssPg.",".gsssmmsssg.",".ggssssssgg.","gggggggggggg",
"gGgnnnnnngGg",".gnnnnnnnng.",".nnnnnnnnnn.",".nnnnNnnnnn.","snnnnNnnnnns",".nnnnNnnnnn.",".nnnnnnnnnn.","..nnnnnnnn..","..nnnnnnnn..","...oo..oo..."],
melM:["...gggggg...","..gggGgggg..",".gggggggggg.",".ggssssssgg.",".gssssssssg.",".gsessssesg.",".gPssssssPg.",".gsssmmsssg.",".ggssssssgg.","gggggggggggg",
"gGgnnnnnngGg",".gnnnnnnnng.",".nnnnNnnnnn.",".nnnnNnnnnn.","snnnnNnnnnns",".nnnnNnnnnn.","..pppppppp..","..ppp..ppp..","..ppp..ppp..","...oo..oo..."],

npc:["...aaaaaa...","..aaaaaaaa..",".aaaaaaaaaa.",".aassssssaa.",".assssssssa.","..sesssses..","..ssssssss..","..sssmmsss..","...ssssss...","....ssss....",

baby:["..ssss..",".ssssss.",".skssks.",".PsmmsP.","llllllll","lLllllLl",".llllll.","..llll.."],

moon:["..fffff..",".fffffff.","ffffffZff","fffffffff","ffZffffff","fffffffff",".ffffZff.","..fffff.."],
pine:[".....w.....","....wTw....","...TTTTT...","..wwTTTww..","..TTTTTTT..",".TTTTTTTTT.",".wwTTTTTww.",".TTTTTTTTT.","TTTTTTTTTTT","TTUTTTTTUTT","....qq.....","....qq....."],

rover:["......vv........","......vk........",".......v........","..uuuuuuuuuuuu..","..vvvvvvvvvvvv..",".vVvvvvvvvvvvVv.",".vvvvvvvvvvvvvv.",".kkk..kkk..kkk..",".kVk..kVk..kVk..",".kkk..kkk..kkk.."],
manti:["..d.d.d..",".ddddddd.","fffxfxfff","zzzzzzzzz",".zZzzzZz.","..zzzzz.."],

};
const DIG={"0":["111","101","101","101","111"],"1":["010","110","010","010","111"],"2":["111","001","111","100","111"],"3":["111","001","111","001","111"],"4":["101","101","111","001","001"],

const sprCache={};
function getSpr(name,pal){
  const key=name+(pal?JSON.stringify(pal):"");
  if(sprCache[key])return sprCache[key];
  const rows=SPR[name], w=Math.max(...rows.map(r=>r.length)), h=rows.length;
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const g=c.getContext("2d");
  rows.forEach((row,y)=>{[...row].forEach((ch,x)=>{ if(ch==="."||ch===" ")return; const col=(pal&&pal[ch])||PAL[ch]; if(!col)return; g.fillStyle=col; g.fillRect(x,y,1,1); });});
  return (sprCache[key]=c);
}
function spr(name,x,y,o={}){
  const c=getSpr(name,o.pal), sc=o.scale||1;
  ctx.drawImage(c,Math.round(x),Math.round(y),c.width*sc,c.height*sc);
}
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function circ(cx,cy,r,c){for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy));R(cx-w,cy+dy,w*2+1,1,c);}}
function digits(str,x,y,sc,col){for(const ch of str){const b=DIG[ch];if(b){for(let r=0;r<5;r++)for(let c=0;c<3;c++)if(b[r][c]==="1")R(x+c*sc,y+r*sc,sc,sc,col);}x+=4*sc;}}
function digitsW(str,sc){return str.length*4*sc-sc;}

/* ================= ORTAK ÇİZİMLER ================= */
const STARS=Array.from({length:46},(_,i)=>({x:(i*53+17)%LW,y:(i*29+7)%118,p:i*0.7}));
const FLAKES=Array.from({length:60},()=>({x:Math.random()*LW,y:Math.random()*LH,s:Math.random()<.25?2:1,v:8+Math.random()*14,p:Math.random()*6}));
const WFLAKES=Array.from({length:14},()=>({x:Math.random()*36,y:Math.random()*28,v:5+Math.random()*6}));

function nightSky(t,h){
  const cols=["#140f26","#1a1330","#21173a","#281c44","#30214f","#3a275a"], bh=Math.ceil(h/cols.length);
  cols.forEach((c,i)=>R(0,i*bh,LW,bh,c));
  for(const s of STARS){ if(s.y>h-12)continue; const v=Math.sin(t*2+s.p*3); if(v>-.5)R(s.x,s.y,1,1,v>.7?"#ffffff":"#bda6e6"); }
}
function snow(t,dt,col="#ffffff",maxY=LH){
  for(const f of FLAKES){ f.y+=f.v*dt; f.x+=Math.sin(t+f.p)*0.15; if(f.y>maxY){f.y=-2;f.x=Math.random()*LW;} if(f.x<0)f.x+=LW; if(f.x>LW)f.x-=LW; R(f.x,f.y,f.s,f.s,col); }
}
function cloud(x,y){circ(x,y,6,"#cbbde6");circ(x+8,y-3,8,"#d6caee");circ(x+17,y,6,"#cbbde6");R(x-6,y,30,7,"#cbbde6");}
function drawCabin(x,y,t){
  R(x,y+12,30,16,"#7a4a2a"); for(let i=0;i<5;i++)R(x,y+14+i*3,30,1,"#5e3820");
  for(let i=0;i<12;i++)R(x-3+i,y+12-i,36-2*i,1,i>8?"#f4f6fb":"#5e3820");
  R(x-3,y+12,36,1,"#f4f6fb");
  const fl=Math.sin(t*5)>0.7?"#ffe7a8":"#ffd27a";
  ctx.globalAlpha=.18;R(x+1,y+13,14,13,"#ffd27a");ctx.globalAlpha=1;
  R(x+4,y+16,8,7,"#4a2c18");R(x+5,y+17,6,5,fl);R(x+7,y+17,1,5,"#4a2c18");R(x+5,y+19,6,1,"#4a2c18");
  R(x+18,y+18,7,10,"#4a2c18");R(x+23,y+23,1,1,"#ffd27a");
  R(x+22,y+1,4,7,"#6b4a3a");R(x+21,y,6,2,"#f4f6fb");
  for(let i=0;i<4;i++){const k=(t*0.5+i/4)%1;ctx.globalAlpha=0.6*(1-k);R(x+23+Math.sin(k*6+i)*2,y-3-k*20,3,3,"#dcdcea");}
  ctx.globalAlpha=1;
}
function interior(t,dt){
  R(0,0,LW,LH,"#7a4a2a");
  for(let y=0;y<140;y+=8){R(0,y,LW,1,"#5e3820");for(let x=((y/8)%2)*20;x<LW;x+=40)R(x,y,1,8,"#5e3820");}
  // pencere
  R(10,24,40,32,"#4a2c18");R(12,26,36,28,"#1d1636");
  for(const f of WFLAKES){f.y+=f.v*dt;if(f.y>24){f.y=0;f.x=Math.random()*36;}R(12+f.x,26+f.y,1,1,"#ffffff");}
  R(12,49,36,5,"#e9edf8");R(29,26,2,28,"#4a2c18");R(12,38,36,2,"#4a2c18");R(8,55,44,3,"#5e3820");
  // girlanda
  for(let x=0;x<LW;x++){const y=9+Math.round(Math.sin(x/LW*Math.PI*3)*3);R(x,y,1,1,"#2f5d50");
    if(x%12===4){const cols=["#ffd27a","#ff7eb6","#c8a2e8","#9cd3ff"];R(x,y+1,2,2,cols[(x/12+Math.floor(t*2))%4|0]);}}
  // şömine
  ctx.globalAlpha=.1;R(84,84,60,56,"#ff9a3c");ctx.globalAlpha=1;
  R(96,74,44,66,"#8d8794");
  for(let y=74;y<140;y+=6)for(let x=96+((y/6)%2)*5;x<140;x+=10)R(x,y,1,6,"#6f6a78");

  R(107,136,22,3,"#5e3820");
  for(let i=0;i<12;i++){const fx=107+(i*2)%22,h=5+Math.abs(Math.sin(t*9+i*1.7))*12;R(fx,137-h,2,h,i%3===0?"#ffd27a":i%3===1?"#ff9a3c":"#e0503a");}
  // zemin
  R(0,140,LW,40,"#5e3820");for(let y=146;y<LH;y+=7)R(0,y,LW,1,"#4a2c18");
  R(14,154,116,20,"#9b72c9");R(18,157,108,14,"#c8a2e8");
  for(let x=26;x<120;x+=16)spr("heart",x,161,{pal:{X:"#9b72c9",w:"#f3e6fb"}});
}

/* ================= AKTÖRLER ================= */
function actor(name,x,y,o={}){return{name,x,y,tx:x,ty:y,sp:o.sp||30,scale:o.scale||1,pal:o.pal||null,moving:false};}
function updActors(list,dt){
  for(const a of list){const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy);
    if(d<0.5){a.x=a.tx;a.y=a.ty;a.moving=false;continue;}

function noteAt(f,t0,d,type,v,dest){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+d+0.03);
}
function tone(f,d,type="square",v=0.3,w=0,slideTo){
  if(!AC)return;const t0=AC.currentTime+w;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+d);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(g);g.connect(sfxG);o.start(t0);o.stop(t0+d+0.03);

function startMusic(){
  if(!AC||musicTimer)return;nextT=AC.currentTime+0.1;
  musicTimer=setInterval(()=>{
    if(!AC||AC.state!=="running")return;
    if(nextT<AC.currentTime-0.2)nextT=AC.currentTime+0.05;
    while(nextT<AC.currentTime+0.4){
      const bar=(step>>3)%8,s=step%8,m=MEL[bar*8+s];
      if(m){noteAt(mtof(m),nextT,0.42,"triangle",0.5,musG);noteAt(mtof(m+12),nextT,0.12,"square",0.04,musG);}
      if(s===0||s===4)noteAt(mtof(BASS[bar]),nextT,0.55,"triangle",0.45,musG);
      step++;nextT+=STEP;
    }
  },100);
}

const fx=$("#fx");
function heartURL(c){const k=document.createElement("canvas");k.width=7;k.height=6;const g=k.getContext("2d");
  SPR.heart.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch!=="."){g.fillStyle=ch==="w"?"#ffffffdd":c;g.fillRect(x,y,1,1);}}));return k.toDataURL();}
const HEARTS=["#c8a2e8","#ff7eb6","#e0559a","#b48ae0","#ffb3d1"].map(heartURL);
function spawnHeart(x,y,o={}){
  const d=document.createElement("div");d.className="hp"+(o.amb?" amb":"");
  const s=Math.round(o.size||10+Math.random()*14);d.style.width=s+"px";d.style.height=Math.round(s*6/7)+"px";
  d.style.left=x+"px";d.style.top=y+"px";d.style.backgroundImage=`url(${HEARTS[Math.random()*HEARTS.length|0]})`;
  d.style.setProperty("--dx",(o.dx!=null?o.dx:(Math.random()-.5)*160)+"px");
  d.style.setProperty("--dy",(o.dy!=null?o.dy:-80-Math.random()*160)+"px");
  const dur=o.dur||1.2+Math.random();d.style.animationDuration=dur+"s";
  fx.appendChild(d);setTimeout(()=>d.remove(),dur*1000+150);
}
function burst(x,y,n=16){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,r=50+Math.random()*90;spawnHeart(x,y,{dx:Math.cos(a)*r,dy:Math.sin(a)*r-40,dur:.9+Math.random()*.7});}}
function heartsRain(n){const a=app.getBoundingClientRect();for(let i=0;i<n;i++)setTimeout(()=>spawnHeart(Math.random()*a.width,-10,{dx:(Math.random()-.5)*60,dy:a.height+40,dur:2.5+Math.random()*1.5,size:10+Math.random()*12}),i*60);}
function burstAtEl(el,n){const r=el.getBoundingClientRect(),a=app.getBoundingClientRect();burst(r.left-a.left+r.width/2,r.top-a.top+r.height/2,n);}
function toApp(lx,ly){const r=cv.getBoundingClientRect(),a=app.getBoundingClientRect();return{x:r.left-a.left+lx/LW*r.width,y:r.top-a.top+ly/LH*r.height};}
function toast(x,y,txt){const d=document.createElement("div");d.className="toast";d.textContent=txt;d.style.left=x+"px";d.style.top=y+"px";fx.appendChild(d);setTimeout(()=>d.remove(),1150);}
let HC=0;const hcEl=$("#hc");
function addHearts(n){HC+=n;hcEl.textContent="💜 "+HC;hcEl.classList.remove("pulse");void hcEl.offsetWidth;hcEl.classList.add("pulse");}
function startAmbient(){setInterval(()=>{if(document.hidden)return;const r=cv.getBoundingClientRect(),a=app.getBoundingClientRect();

/* ================= ÇİZİM DÖNGÜSÜ ================= */
let scene=null,sceneT0=performance.now(),last=performance.now();
function setScene(s){scene=s;sceneT0=performance.now();}
function resize(){
  const r=wrap.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,3);
  const aw=r.width-22,ah=r.height-32;
  const s=Math.max(1,Math.floor(Math.min(aw/LW,ah/LH)*dpr));
  if(s!==S||cv.width!==LW*s){S=s;cv.width=LW*s;cv.height=LH*s;}
  cv.style.width=(LW*s/dpr)+"px";cv.style.height=(LH*s/dpr)+"px";
}
function loop(now){
  const dt=Math.min((now-last)/1000,0.05);last=now;
  ctx.setTransform(S,0,0,S,0,0);ctx.imageSmoothingEnabled=false;
  if(scene)scene.draw((now-sceneT0)/1000,dt);
  requestAnimationFrame(loop);
}
if(window.ResizeObserver)new ResizeObserver(resize).observe(wrap);
window.addEventListener("resize",resize);

let mode="idle",advanceFn=null,stageHandler=null,lastAdv=0;
function setName(w){if(w){nameEl.textContent=w;nameEl.style.display="block";}else nameEl.style.display="none";}
function clearChoices(){choicesEl.innerHTML="";choicesEl.hidden=true;choicesEl.className="";}
function say(who,text){return new Promise(res=>{
  mode="say";clearChoices();setName(who);textEl.textContent="";nextEl.style.visibility="hidden";
  const chars=Array.from(text);let i=0,done=false;
  const finish=()=>{done=true;textEl.textContent=text;nextEl.style.visibility="visible";lastAdv=performance.now();};
  const iv=setInterval(()=>{i++;textEl.textContent=chars.slice(0,i).join("");if(i%2===0)sfx.blip();if(i>=chars.length){clearInterval(iv);finish();}},26);
  advanceFn=()=>{if(performance.now()-lastAdv<180)return;
    if(!done){clearInterval(iv);finish();return;}
    advanceFn=null;mode="idle";nextEl.style.visibility="hidden";sfx.select();res();};
});}
function choose(prompt,opts,who=null){return new Promise(res=>{
  mode="choice";setName(who);textEl.textContent=prompt;nextEl.style.visibility="hidden";
  choicesEl.className="";choicesEl.innerHTML="";choicesEl.hidden=false;
  opts.forEach((o,i)=>{const b=document.createElement("button");b.textContent=o;
    b.onclick=e=>{e.stopPropagation();if(mode!=="choice")return;mode="idle";sfx.select();burstAtEl(b,14);addHearts(2);
      setTimeout(()=>{clearChoices();res(i);},500);};
    choicesEl.appendChild(b);});
});}
function chapter(tag,date,sub){return new Promise(res=>{
  const el=$("#chapter");el.innerHTML=`<div class="ctag">${tag}</div><div class="cdate">${date}</div><div class="csub">${sub}</div><div class="ctap">devam etmek için dokun ▶</div>`;
  el.classList.add("show");$("#chap").textContent=`💜 ${tag} · ${date}`;sfx.chime();
  clearChoices();setName(null);textEl.textContent="";nextEl.style.visibility="hidden";

});}
dlg.addEventListener("click",()=>{if(mode==="say"&&advanceFn)advanceFn();});
function toL(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*LW,y:(e.clientY-r.top)/r.height*LH};}
cv.addEventListener("pointerdown",e=>{e.preventDefault();if(mode==="say"&&advanceFn){advanceFn();return;}if(stageHandler&&stageHandler.down)stageHandler.down(toL(e));});

function gameCatch(){return new Promise(res=>{
  mode="game";clearChoices();setName("Mini oyun");nextEl.style.visibility="hidden";
  textEl.textContent="🥟 Mantıları ve 🍮 sütlü tatlıları tepsiyle topla, ❄️ kartopundan kaç!\nParmağını sağa sola kaydır. Süre: 30 sn";
  const DUR=30,types=[["manti",18,12,1],["sutlac",18,10,1],["puding",14,12,1],["kartopu",12,12,-1]];
  let score=0,items=[],spawnT=0.5,px=72,tx=72,over=false,flash=0,t0=null;
  setScene({draw(t,dt){
    if(t0===null)t0=t;const el=t-t0,rem=Math.max(0,DUR-el);
    kitchenBG();
    if(!over){spawnT-=dt;if(spawnT<=0){spawnT=Math.max(0.34,0.75-el*0.013);const r=Math.random(),ty=r<.32?0:r<.55?1:r<.77?2:3,T=types[ty];
      items.push({k:T[0],w:T[1],h:T[2],v:T[3],x:4+Math.random()*(LW-8-T[1]),y:-8,sp:30+Math.random()*22+el*1.3});}}
    px+=(tx-px)*Math.min(1,dt*14);
    const trayY=134,pl=px-18,pr=px+18;
    for(const it of items){it.y+=it.sp*dt;const b=it.y+it.h;
      if(!over&&!it.done&&b>=trayY&&b<=trayY+9&&it.x+it.w>pl&&it.x<pr){it.done=true;
        if(it.v>0){score++;sfx.catch();const ap=toApp(it.x+it.w/2,trayY-4);spawnHeart(ap.x,ap.y,{dx:(Math.random()-.5)*30,dy:-60,dur:.9,size:12});addHearts(1);}
        else{score=Math.max(0,score-1);sfx.bad();flash=0.35;}}}
    items=items.filter(it=>!it.done&&it.y<LH+10);
    items.forEach(it=>spr(it.k,it.x,it.y,{scale:2}));
    spr("mel",px-12,LH-42,{scale:2});
    R(px-18,trayY,36,3,"#c8a2e8");R(px-18,trayY+3,36,1,"#9b72c9");R(px-12,trayY+4,3,3,"#f2c6a0");R(px+9,trayY+4,3,3,"#f2c6a0");

      textEl.textContent=`Süre doldu! Tam ${score} lezzet topladın! 😋`;setTimeout(()=>res(score),1700);}
  }});

});}

const Q=[
  ["Seni ilk nerede gördüm?",["Güngören'de bir bodrum katta","Boğaziçi Üniversitesi'nde","Bilim şenliğinin çıkışında","Bir otobüs durağında"]],
  ["İlk ne zaman tanıştık?",["22 Temmuz 2023","27 Ağustos 2023","14 Eylül 2023","24 Kasım 2023"]],
  ["Zümra o gün neyi kullanmak istedi?",["Mars rover simülasyonunu","Teleskobu","Robot kolu","VR gözlüğünü"]],
  ["Takip isteğini hangi gün attım?",["27 Ağustos 2023","22 Temmuz 2023","14 Eylül 2023","24 Kasım 2023"]],
  ["İlk buluşmamız nerede oldu?",["Boğaziçi Üniversitesi","Güngören","Bir bilim şenliği","Bir durak"]],
  ["Sevgili olduğumuz tarih?",["14 Eylül 2023","27 Ağustos 2023","22 Temmuz 2023","24 Kasım 2023"]],
  ["En sevdiğin yemek?",["Mantı","Lahmacun","Makarna","Sushi"]],
  ["Hangi tatlılara bayılırsın?",["Sütlü tatlılara","Şerbetli tatlılara","Çikolatalı pastalara","Meyveli tatlılara"]],
  ["En sevdiğin renk?",["Lila","Pembe","Zeytin yeşili","Lacivert"]]
];
async function quiz(){
  let score=0;
  for(let qi=0;qi<Q.length;qi++){
    const [q,opts]=Q[qi];const sh=opts.map((t,i)=>({t,ok:i===0})).sort(()=>Math.random()-.5);
    score+=await new Promise(res=>{
      mode="quiz";setName(`Soru ${qi+1}/${Q.length}`);textEl.textContent=q;nextEl.style.visibility="hidden";
      choicesEl.className="grid";choicesEl.innerHTML="";choicesEl.hidden=false;let first=true,done=false;
      sh.forEach(o=>{const b=document.createElement("button");b.textContent=o.t;
        b.onclick=e=>{e.stopPropagation();if(done||b.disabled)return;
          if(o.ok){done=true;b.classList.add("right");sfx.good();burstAtEl(b,16);addHearts(3);setTimeout(()=>res(first?1:0),900);}
          else{first=false;b.classList.add("wrong");b.disabled=true;sfx.bad();}};
        choicesEl.appendChild(b);});
    });
  }
  clearChoices();return score;
}

  await say(null,"Yıllar geçti. Minik bebek büyüdü, büyüdü…");
  await say(null,"…tıpkı lila bir çiçek gibi. 🌸");
  await say(null,"O bebek sendin. Ve 2023 yazında, henüz tanımadığın biri seni görmek üzereydi…");

  // BÖLÜM 2
  await chapter("BÖLÜM 2","22 Temmuz 2023","Güngören · Bir bodrum kat");
  const m=SCN.basement();setScene(m);
  await say(null,"Güngören'de bir bilim etkinliği. Bir bodrum kat. Her yer veli ve çocuk dolu.");
  m.enter();
  await say(null,"Cihan, küçük kız kardeşi Zümra'yla merdivenlerden iniyor…");
  await say(null,"…ve daha merdivenden iner inmez, velilerin arasında birini görüyor. 👀");
  await gameFind(1);
  await gameFind(2);
  setScene(m);m.look=true;
  await say(null,"Cihan seni çok beğendi ve fark ettirmeden incelemeye başladı. 🕵️💜");
  await choose("Peki sen merdivenden inen bu çocuğu fark etmiş miydin?",["Evet 👀","Hayır, hiç 🙈","Belki biraz… 🤭"]);
  await say(null,"Ne dersen de… o seni çoktan fark etmişti. 💜");
  await say(null,"Sen o gün bir Mars rover simülasyonunun başında duruyordun. 🚀");
  await say("Cihan (içinden)","İnşallah Zümra şu rover'ı kullanmak ister de yanına gidip konuşma fırsatı bulurum… 🤲");
  m.zumraGo();
  await say("Zümra","Abi! Ben şunu kullanmak istiyorum! 🚀");
  {const p=toApp(72,100);burst(p.x,p.y,18);}
  await say(null,"Ve dua kabul oldu. ✨");
  m.cihanGo();
  await choose("Zümra rover'ı kullanmak istiyor, Cihan da hemen yanında. Sen ne yaparsın?",["🎮 Kumandayı veririm","🚀 Nasıl kullanılacağını gösteririm","😊 Gülümser, yardım ederim"]);
  await say(null,"Hangisini seçersen seç, sonuç aynı: o gün ilk kez konuştunuz. 💬💜");

  // BÖLÜM 3
  await chapter("BÖLÜM 3","27 Ağustos 2023","Bilim şenliği · Durak");
  const st=SCN.stop();setScene(st);
  await say(null,"Sonra bir bilim şenliği oldu. 🔬");
  await say(null,"Şenliğin çıkışında biraz daha konuştunuz…");
  await say(null,"…ve durakta Cihan telefonunu çıkardı. 📱");
  await notif();
  st.chat=true;
  await say(null,"Ve konuşmalar başladı… 💬💜");

  // BÖLÜM 4
  await chapter("BÖLÜM 4","14 Eylül 2023","Boğaziçi Üniversitesi");
  const bg=SCN.bogazici();setScene(bg);
  await say(null,"Yaklaşık iki hafta sonra… 🌊");
  await say(null,"İlk buluşmanız: Boğaziçi Üniversitesi.");
  await say(null,"Ve aynı gün Cihan sana bir soru sordu…");
  await choose("\"Sevgilim olur musun?\" 💜",["Evet 💜","Evet evet evet! 💜💜💜"],"Cihan");
  bg.together();
  {const p=toApp(72,100);burst(p.x,p.y,30);setTimeout(()=>burst(p.x,p.y,24),300);heartsRain(30);sfx.fanfare();addHearts(14);}
  await say(null,"14 Eylül 2023. Hikâyemizin resmen başladığı gün. 💜");

  // BÖLÜM 5
  await chapter("BÖLÜM 5","3 Yıl","Lego, mantı ve sütlü tatlılar");
  const mem=SCN.memories();setScene(mem);
  await say(null,"Sonra günler, aylar, yıllar geçti…");
  await say(null,"Sana aldığım Lego setleri… 🧱");
  await say(null,"Sayısız mantı, sayısız sütlü tatlı… 🥟🍮");
  await say(null,"Hadi bir de oyunda yakala bakalım! 😋");
  const sc=await gameCatch();
  setScene(mem);
  await say(null,`${sc} lezzet! Afiyet olsun sevgilim. 😋💜`);
  await say(null,"Tam 3 yıl. Ve her günü seninle güzel. 💜");

  // BÖLÜM 6
  await chapter("BÖLÜM 6","Küçük bir sınav","Bizi ne kadar iyi tanıyorsun?");
  setScene(SCN.quizBg());
  await say(null,"Şimdi bakalım bizi ne kadar iyi tanıyorsun… 🤭 Dikkat, bazı şıklar biraz kafa karıştırıcı!");
  const qs=await quiz();
  await say(null,`${qs}/${Q.length} ilk denemede doğru! `+(qs===Q.length?"Kusursuz! Tabii ki hepsini biliyordun. 💜":"Olsun, en önemli cevabı zaten biliyorsun: seni çok seviyorum. 💜"));

  // BÖLÜM 7
  await chapter("BÖLÜM 7","Gelecek","İnşallah…");
  setScene(SCN.wedding());
  await say(null,"Peki ya sonrası?");
  await say(null,"İnşallah bir gün… beyazlar içinde. 💍");
  setScene(SCN.old());
  await say(null,"Ve yıllar sonra, saçlarımıza kar yağdığında bile…");
  await say(null,"…aynı bankta, aynı kalple. 💜");

  // FİNAL
  await chapter("SEVİYE 23","24 Kasım 2026","İyi ki doğdun Melisa 💜");
  const party=SCN.party();setScene(party);
  await say(null,"Ve bugün… 24 Kasım 2026.");
  await say(null,"Seviye 23'e hoş geldin! 🎉");
  await blowCandles(party);
  showLetter();
}

resize();requestAnimationFrame(loop);
run().catch(err=>{console.error(err);});
})();
</script>
